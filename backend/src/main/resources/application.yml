spring:
  application:
    name: kindredlink
  datasource:
    # Local demo defaults: MySQL via `docker compose up -d db` (see compose.yaml).
    # Demo-only credentials - never reuse outside local development.
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/kindred}
    username: ${DATABASE_USER:kindred}
    password: ${DATABASE_PASSWORD:kindred_demo}
  jpa:
    hibernate:
      # Demo convenience only: lets the schema evolve without migrations.
      # Not a substitute for managed migrations (e.g. Flyway) in production.
      ddl-auto: update
    open-in-view: false
  mvc:
    # Errors come back as {"status":409,"title":"slot_closed","detail":"..."} (see ApiException).
    problemdetails:
      enabled: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /docs

# Game rules. Tune here, not in code.
kindred:
  node:
    max-children: 2
    open-hours: 12
  continue-rules:
    # How close (metres) you must be to the parent's real location to continue it.
    max-distance-meters: 2000
  chain:
    # A chain with open slots but no new link for this long is "Quiet" instead of "Active".
    quiet-after-hours: 3
  privacy:
    # Public pins are snapped to a grid of this size, then jittered inside the cell.
    grid-meters: 250
  business:
    max-checkin-distance-meters: 150
  geocoding:
    # Public Nominatim demo lookup: <=1 req/s enforced in-process, 24 h memory cache.
    # Demo only - multiple backend instances must coordinate rate or use a provider.
    base-url: ${GEOCODING_BASE_URL:https://nominatim.openstreetmap.org}
    user-agent: ${GEOCODING_USER_AGENT:KindredLink-Demo/1.0 (+https://github.com/Jozeph-Zemambo/Kindred-Link)}
  seed-demo-data: true

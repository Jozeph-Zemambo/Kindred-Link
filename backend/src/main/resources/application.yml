spring:
  application:
    name: kindredlink
  datasource:
    # Local demo defaults: MySQL via `docker compose up -d db` (see compose.yaml).
    # Demo-only credentials - never reuse outside local development.
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/kindred}
    username: ${DATABASE_USER:kindred}
    password: ${DATABASE_PASSWORD:kindred_demo}
  jpa:
    hibernate:
      # Demo convenience only: lets the schema evolve without migrations.
      # Not a substitute for managed migrations (e.g. Flyway) in production.
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      # Photo upload size limit. The phone compresses first, so 5 MB is generous.
      max-file-size: 5MB
      max-request-size: 6MB
  mvc:
    # Errors come back as {"status":409,"title":"slot_closed","detail":"..."} (see ApiException).
    problemdetails:
      enabled: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /docs

# Game rules. Tune here, not in code.
kindred:
  node:
    max-children: 2
    # How long someone has to post their act after claiming a slot (capped at the chain's end).
    # A node itself stays claimable until its chain ends (see chain.max-days).
    finish-hours: 12
  continue-rules:
    # How close (metres) you must be to the parent's real location to continue it.
    max-distance-meters: 2000
  chain:
    # A chain with open slots but no new link for this long is "Quiet" instead of "Active".
    quiet-after-hours: 3
    # Hard stop: this many days after a chain's first node, nobody can claim or add links to it.
    max-days: 7
  privacy:
    # Public pins are snapped to a grid of this size, then jittered inside the cell.
    grid-meters: 250
  business:
    max-checkin-distance-meters: 150
  geocoding:
    # Public Nominatim demo lookup: <=1 req/s enforced in-process, 24 h memory cache.
    # Demo only - multiple backend instances must coordinate rate or use a provider.
    base-url: ${GEOCODING_BASE_URL:https://nominatim.openstreetmap.org}
    user-agent: ${GEOCODING_USER_AGENT:KindredLink-Demo/1.0 (+https://github.com/Jozeph-Zemambo/Kindred-Link)}

  moderation:
    # Secret key moderators send in the X-Admin-Key header to see pending photos and approve or reject
    # them. Empty means moderation is switched off, so nobody can approve anything. Turn it on by
    # setting the MODERATOR_KEY environment variable (never commit a real key).
    admin-key: ${MODERATOR_KEY:}

  seed-demo-data: true

# Auth0 API config: set these as environment variables (never commit a client secret).
# Domain is hostname only, e.g. dev-example.us.auth0.com; audience is the API Identifier.
auth0:
  domain: ${AUTH0_DOMAIN:}
  audience: ${AUTH0_AUDIENCE:}
